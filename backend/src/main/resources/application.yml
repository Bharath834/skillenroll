spring:
  application:
    name: skillenroll-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skillenroll?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# --- Service Discovery (Eureka) ---
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# --- JWT configuration (Day 3) ---
# secret is a Base64-encoded 384-bit HMAC-SHA key; override in production via JWT_SECRET.
app:
  jwt:
    secret: '${JWT_SECRET:Naxi60zfyJogjfLK/iRaMX0qPP0qhOUuU3xHnUpjoqGeVxPsAsWadrefaVEFYfuC}'
    expiration-ms: '${JWT_EXPIRATION_MS:86400000}'

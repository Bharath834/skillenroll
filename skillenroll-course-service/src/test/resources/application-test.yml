# Test profile: in-memory H2 (MySQL compatibility mode), schema recreated per run,
# Eureka disabled so tests never touch service discovery.
spring:
  datasource:
    url: jdbc:h2:mem:skillenroll_courses;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.skillenroll.courseservice: info
    org.hibernate.SQL: warn
